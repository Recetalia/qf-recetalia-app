<div class="card">
  <div class="card-header text-center">
    <div class="row">
      <div class="col-12">
        <img src="../../../assets/images/logos/logo.png" alt="">
      </div>
      <div class="col-12">
        <h3>Cambiá tu contraseña</h3>
        <p>Es tu primer ingreso. Definí una contraseña nueva para continuar.</p>
      </div>
    </div>
  </div>
  <div class="card-body">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <input type="password" class="form-control" placeholder="Nueva contraseña" formControlName="password">
        <div *ngIf="passwordControl.touched && passwordControl.invalid" class="text-danger">
          <p>Mínimo 6 caracteres.</p>
        </div>
      </div>
      <div class="mb-1">
        <input type="password" class="form-control" placeholder="Repetí la contraseña" formControlName="confirm">
      </div>

      <div *ngIf="error" class="text-danger mb-1">
        {{ error }}
      </div>

      <div class="row text-center mt-3">
        <div class="col-12">
          <button type="submit" class="btn btn-primary">Guardar contraseña</button>
        </div>
      </div>
    </form>
  </div>
</div>
