<div class="card">
  <div class="card-header text-center">
    <div class="row">
      <div class="col-12">
        <img src="../../../assets/images/logos/logo.png" alt="">
      </div>
      <div class="col-12">
        <h3>Ingreso Químico Farmacéutico</h3>
      </div>
    </div>
  </div>
  <div class="card-body">
    <form [formGroup]="ngForm" (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <input type="text" class="form-control" id="cjp" placeholder="Ingrese su CJP" inputmode="text" formControlName="cjp">
        <div *ngIf="cjpControl.touched && cjpControl.invalid" class="text-danger">
          <p>El CJP es necesario!!</p>
        </div>
      </div>
      <div class="mb-1">
        <input type="password" class="form-control" id="password" placeholder="Ingrese su contraseña" formControlName="password">
        <div *ngIf="passwordControl.touched && passwordControl.invalid" class="text-danger">
          <p>Password es necesario!!</p>
        </div>
      </div>

      <div *ngIf="error" class="text-danger mb-1">
        {{ error }}
      </div>

      <div class="row text-center mt-3">
        <div class="col-12">
          <button type="submit" class="btn btn-primary">Ingresar</button>
        </div>
      </div>
    </form>
  </div>
</div>
