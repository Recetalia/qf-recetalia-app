<div class="modal-content pt-0">
  <div class="modal-body">
    <form [formGroup]="dispenserForm" (ngSubmit)="onSubmit()">
      <!-- Name Field -->
      <div class="form-group mb-2">
        <label for="name">Nombre</label>
        <input type="text" class="form-control" id="name" formControlName="name" placeholder="Nombre">
        <div *ngIf="dispenserForm.get('name')?.invalid && dispenserForm.get('name')?.touched" class="text-danger">
          El nombre es requerido.
        </div>
      </div>

      <!-- Lastname Field -->
      <div class="form-group mb-2">
        <label for="lastname">Apellido</label>
        <input type="text" class="form-control" id="lastname" formControlName="lastname" placeholder="Apellido">
        <div *ngIf="dispenserForm.get('lastname')?.invalid && dispenserForm.get('lastname')?.touched" class="text-danger">
          El apellido es requerido.
        </div>
      </div>

      <!-- Document Fields -->
      <div class="form-group mb-2">
        <label for="documentType">Tipo de documento</label>
        <select class="form-control" id="documentType" formControlName="documentType">
          <option value="UY">Cédula UY</option>
          <option value="AR">Cédula AR</option>
          <option value="PASSPORT">Pasaporte</option>
          <option value="RUT">RUT</option>
          <option value="OTHER">Otro</option>
        </select>
        <div *ngIf="dispenserForm.get('documentType')?.invalid && dispenserForm.get('documentType')?.touched" class="text-danger">
          Tipo de documento es requerido.
        </div>
      </div>

      <div class="form-group mb-2">
        <label for="documentNumber">Número de documento</label>
        <input type="text" class="form-control" id="documentNumber" formControlName="documentNumber" placeholder="Número de documento">
        <div *ngIf="dispenserForm.get('documentNumber')?.invalid && dispenserForm.get('documentNumber')?.touched" class="text-danger">
          Número de documento es requerido.
        </div>
      </div>

      <!-- Pharmacy ID (Hidden or passed programmatically) -->
      <input type="hidden" formControlName="pharmacyId">

      <!-- Action Buttons -->
      <div class="d-flex justify-content-between mt-3">
        <button type="button" class="btn btn-light" (click)="onCancel()">Cancelar</button>
        <button type="submit" class="btn btn-success">{{ actionFrom }}</button>
      </div>
    </form>
  </div>
</div>
