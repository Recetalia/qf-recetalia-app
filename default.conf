server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # nginx no trae .webmanifest en mime.types, asi que caeria en
  # application/octet-stream. No usar un bloque types{} a nivel server: reemplaza
  # el mapa heredado entero y romperia el MIME de css/js.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot)$ {
    expires 1y;
    log_not_found off;
  }
}